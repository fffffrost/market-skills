slug: voice-of-customer-synthesis
english_name: Voice of Customer Synthesis
phase: insight
locales:
  en:
    title: China Voice of Customer Synthesis
    summary: Synthesize Chinese interviews, reviews, sales notes, support records, and social comments without erasing platform context or overstating the sample.
    phase_label: Insight
    roles: [Customer research, Product marketing, Content, Customer success]
    tasks: [Chinese interview synthesis, Review analysis, Social listening synthesis, Demand clustering]
    inputs: [Chinese research materials, Source metadata, Audience segments, Decision question]
    outputs: [Evidence-backed themes, Verbatim quotes, Segment differences, Action matrix]
    limitations: [Cannot generalize a small or convenience sample to the China market, Does not replace quantitative research or continuous social listening, Must not process personal data without an appropriate basis]
    failure_modes: [Translation removes the original customer wording before analysis, Platform audience and customer stage are mixed into one theme, Findings are counted without preserving source and sampling boundaries]
    protocol_steps: [Define the China decision, Preserve source and language context, Code observations, Compare platform and segment patterns, Build evidence-backed insights, Convert insights into tests]
    dependencies: [The host must be able to read the supplied Chinese materials]
    example_prompt: Synthesize these Chinese customer interviews and REDnote comments for our market-entry messaging, preserving quotations and sample limits.
  zh:
    title: 用户声音提炼
    summary: 从访谈、评论和客户反馈中识别任务、张力与决策障碍，同时保留证据链和样本边界。
    phase_label: 洞察
    roles: [用户研究, 产品市场, 内容, 客户成功]
    tasks: [访谈整理, VOC 分析, 评论洞察, 需求聚类]
    inputs: [访谈记录, 评论与工单, 销售笔记, 研究目标]
    outputs: [洞察主题卡, 用户原声, 分群差异, 行动矩阵]
    limitations: [不能把小样本或便利样本外推为中国市场结论, 不替代定量研究或持续舆情监测, 不应在缺少合法依据时处理个人数据]
    failure_modes: [分析前先翻译改写导致用户原话丢失, 不同平台人群和客户阶段被混成一个主题, 统计模式时丢掉来源与样本边界]
    protocol_steps: [先明确要支持的决策, 整理并校验研究材料, 分五轮提炼用户声音, 按决策顺序交付, 守住证据与样本边界]
    dependencies: [宿主需能读取用户提供的材料]
    example_prompt: 把这 12 份客户访谈整理成面向新产品定位的 VOC 洞察，保留引用和样本限制。
compatibility: [Codex, Claude Code, Cursor, OpenCode]
