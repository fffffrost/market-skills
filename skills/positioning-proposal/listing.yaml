slug: positioning-proposal
english_name: Positioning Proposal
phase: strategy
locales:
  en:
    title: China Market Positioning
    summary: Reframe a global product for a specific China buyer, category, alternative, value promise, and proof set without relying on translated global messaging.
    phase_label: Strategy
    roles: [Product marketing, Brand strategy, Market entry, Founders]
    tasks: [China positioning, Local value proposition, Category framing, Positioning review]
    inputs: [Global positioning, China customer evidence, Local competitor map, Product constraints]
    outputs: [Positioning statement, Strategic routes, Messaging hierarchy, Validation plan]
    limitations: [Weak China customer evidence can only support hypotheses for testing, Does not replace naming trademark or regulated-claims review, Cannot make a global proof point locally credible by translation alone]
    failure_modes: [Global messaging is translated before the local buying context is defined, The proposal lists benefits without choosing an audience or alternative, A recommended route has no China-specific proof or validation plan]
    protocol_steps: [Audit the global position, Define the China buying context, Choose audience frame promise and proof, Compare no more than three routes, Recommend one route, Plan local validation]
    dependencies: [China customer and competitor evidence materially improves the result]
    example_prompt: Rework our global positioning for Chinese enterprise buyers, using this local VOC and competitor evidence, and recommend one testable route.
  zh:
    title: 定位提案
    summary: 从目标人群、参照系、价值承诺和可信证据出发，形成可选择、可验证的定位方向。
    phase_label: 策略
    roles: [产品市场, 品牌, 市场策略, 创始团队]
    tasks: [产品定位, 价值主张, 品类定义, 定位评审]
    inputs: [产品资料, 用户洞察, 竞品信息, 商业目标]
    outputs: [定位陈述, 备选路线, 信息层级, 验证计划]
    limitations: [中国客户证据较弱时只能形成待验证假设, 不替代命名商标或受监管表述审查, 不能靠翻译让全球证据自动获得本地信任]
    failure_modes: [未定义本地购买语境就先翻译全球信息, 只罗列卖点而没有选择人群和替代对象, 推荐路线没有中国本地证据和验证计划]
    protocol_steps: [建立证据基础, 做出关键策略选择, 生成并比较定位路线, 组织最终交付, 守住定位边界]
    dependencies: [无强制外部依赖]
    example_prompt: 基于这份产品资料、VOC 和竞品报告，给出不超过三条定位路线并推荐一条。
compatibility: [Codex, Claude Code, Cursor, OpenCode]
