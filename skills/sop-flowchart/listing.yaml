slug: sop-flowchart
english_name: SOP Flowchart
phase: execution
locales:
  en:
    title: China Marketing SOP Flowchart
    summary: Turn China marketing rules, platform review steps, lead qualification, agency handoffs, and exceptions into a readable operating flow with maintainable source.
    phase_label: Execution
    roles: [Marketing operations, Demand generation, Agency management, Team leads]
    tasks: [China marketing SOP, Platform review flow, Lead handoff, Agency workflow]
    inputs: [Current process, Rules and exceptions, Owners and systems, Required records]
    outputs: [Mermaid source, Main flowchart, Rule table, Handoff notes]
    limitations: [Unconfirmed business or platform rules remain marked as unresolved, Does not configure automation systems permissions or external workflows, Regulated or high-risk processes still require domain review]
    failure_modes: [Platform approvals and agency handoffs are hidden inside generic steps, Dense scoring and exceptions are forced into the main graph, Chinese labels are vague or too long for frontline execution]
    protocol_steps: [Separate the main path rules and handoffs, Normalize steps by owner and output, Draw only operational branches, Externalize dense rules and exceptions, Validate every local handoff, Deliver maintainable source]
    dependencies: [Mermaid rendering is optional but improves visual validation]
    example_prompt: Turn this China lead-routing process into a vertical Mermaid SOP with platform review, agency handoff, CRM status, and exception rules.
  zh:
    title: 市场 SOP 流程图
    summary: 把主路径、决策规则、异常和交接拆开，生成一线人员看得懂、后续也能维护的流程图。
    phase_label: 执行
    roles: [市场运营, SDR, 活动营销, 团队负责人]
    tasks: [SOP 流程, 资格判断, 话术逻辑, 跨团队交接]
    inputs: [现有流程, 规则与例外, 角色分工, 交付状态]
    outputs: [Mermaid 源码, 主流程图, 规则表, 交接说明]
    limitations: [未确认的业务或平台规则只能标为待定, 不负责配置自动化系统权限或外部工作流, 受监管或高风险流程仍需领域专家审查]
    failure_modes: [平台审核和代理商交接被藏在模糊通用步骤中, 复杂评分与例外被全部塞进主流程图, 中文节点名称抽象或过长导致一线无法执行]
    protocol_steps: [拆分流程信息, 绘制主流程与决策点, 交付流程图与规则表, 验证可读性与完整性]
    dependencies: [可选 Mermaid 渲染能力]
    example_prompt: 把这份 SDR 线索资格规则整理成纵向 Mermaid 流程图，复杂评分放在图外规则表。
compatibility: [Codex, Claude Code, Cursor, OpenCode]
